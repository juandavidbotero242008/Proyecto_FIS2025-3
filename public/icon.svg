<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Monogram & Symbol -->
  <g filter="url(#glow)">
    <!-- Wallet / Vault Body -->
    <rect x="116" y="156" width="280" height="200" rx="36" fill="url(#accent)" />
    
    <!-- Minimalist flap & cutout -->
    <path d="M116 200 C 116 170, 140 156, 170 156 L 342 156 C 372 156, 396 170, 396 200 L 396 230 L 116 230 Z" fill="#1e293b" opacity="0.25" />
    
    <!-- Card clasp -->
    <rect x="296" y="226" width="100" height="60" rx="18" fill="#0f172a" />
    <circle cx="346" cy="256" r="12" fill="#60a5fa" />
    
    <!-- Growth leaf accent -->
    <path d="M 200 270 C 200 240, 230 220, 260 220 C 260 250, 230 270, 200 270 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
